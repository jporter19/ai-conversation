<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Conversation Hub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header: AI & Model selection + buttons -->
        <header class="app-header">
            <div class="header-left">
                <h1>AI Conversation Hub</h1>
            </div>
            <div class="header-right">
                <div class="selector-group">
                    <label for="ai-select">AI:</label>
                    <select id="ai-select">
                        <option value="">Select AI</option>
                        <option value="grok">Grok (xAI)</option>
                        <option value="chatgpt">ChatGPT (OpenAI)</option>
                    </select>
                </div>
                <div class="selector-group">
                    <label for="model-select">Model:</label>
                    <select id="model-select" disabled>
                        <option value="">Select model after choosing AI</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Main chat area -->
        <main class="chat-container">
            <div class="chat-history" id="chat-history">
                <!-- Messages will go here (placeholder for now) -->

            </div>

            <!-- Input area -->
            <div class="input-area">
                <textarea 
                    id="user-input" 
                    placeholder="Type your message here... (e.g., Write Python code to sort a list)"
                    rows="4"
                ></textarea>
                <button id="send-btn">Send</button>
            </div>

            <!-- Action buttons -->
            <div class="action-buttons">
                <button id="reset-btn">Reset Conversation</button>
                <button id="store-btn">Store Conversation</button>
            </div>
        </main>

        <footer>
            <p>Local development • HTTP only for now • Powered by FastAPI + your vision</p>
        </footer>
    </div>
    <!-- Markdown parser - marked.js (very small, fast, secure) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Optional but recommended: syntax highlighting for code blocks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">

    <!-- Your main script comes last -->
    <script src="/static/js/main.js"></script>
    <!-- Store Conversation Modal -->
    <dialog id="store-modal" class="store-modal">
        <div class="modal-content">
            <h2>Store Conversation</h2>
            <p>How would you like to store this conversation?</p>

            <div class="modal-options">
                <button id="store-whole-btn" class="modal-btn primary">Whole Conversation</button>
                <button id="store-summary-btn" class="modal-btn primary">Summary</button>
            </div>

            <button id="modal-cancel-btn" class="modal-btn secondary">Cancel</button>
        </div>
    </dialog>
</body>
</html>
